# Bibliography for the celld book.
#
# Each entry: id, title, and whichever of author / publisher / date / url apply, plus
# `used_in`: the source documents whose "Sources" line cites it (ch1 = Part 0,
# part2 = the Field Guide, i.e. Chapters 2–8 and Appendices B–C, ch9 = the guide,
# labs = Labs 1–3, appA = the review sheet). Attribution is at that level, because that
# is how the sources were used; no finer per-chapter mapping is claimed.
# Dates are publication dates where the page states one. Accessed 2026-09-26/27.

